apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orbitcloud-landing-hpa
  namespace: orbitcloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orbitcloud-landing
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
