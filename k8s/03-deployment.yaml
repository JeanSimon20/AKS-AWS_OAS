apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitcloud-landing
  namespace: orbitcloud
  labels:
    app: orbitcloud-landing
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: orbitcloud-landing
  template:
    metadata:
      labels:
        app: orbitcloud-landing
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: landing-web
          image: IMAGE_URI_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: APP_VERSION
              value: "APP_VERSION_PLACEHOLDER"
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: orbitcloud-config
                  key: APP_ENV
            - name: BANNER_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: orbitcloud-config
                  key: BANNER_MESSAGE
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
