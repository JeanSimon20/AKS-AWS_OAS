apiVersion: v1
kind: Service
metadata:
  name: orbitcloud-landing-svc
  namespace: orbitcloud
  labels:
    app: orbitcloud-landing
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: orbitcloud-landing
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
