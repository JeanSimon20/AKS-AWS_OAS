name: CI/CD — Build to Amazon ECR & Deploy to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eks-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ECR_REPOSITORY: orbitcloud-landing
  K8S_NAMESPACE: orbitcloud

jobs:
  # ============================================================================
  # ETAPA 1: Integración Continua (Pruebas Automatizadas)
  # ============================================================================
  ci-test:
    name: 1. CI — Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ejecutar pruebas automatizadas (Smoke & Health)
        run: npm test

  # ============================================================================
  # ETAPA 2: Construcción, Escaneo DevSecOps y Publicación en Amazon ECR
  # ============================================================================
  build-and-push-ecr:
    name: 2. Package & Push — Amazon ECR
    needs: ci-test
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
      app_version: ${{ steps.meta.outputs.app_version }}
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Asegurar repositorio en Amazon ECR (con Scan-on-Push activo)
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir imagen Docker versionada con SHA inmutable
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          APP_VERSION="1.0.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${SHORT_SHA}"
          IMAGE_LATEST="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          docker build \
            -t "$IMAGE_URI" \
            -t "$IMAGE_LATEST" \
            .

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_LATEST}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Escaneo DevSecOps de vulnerabilidades en imagen (Trivy desde AWS Public ECR)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            public.ecr.aws/aquasecurity/trivy:latest image \
            --format table \
            --exit-code 0 \
            --ignore-unfixed \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            "${{ steps.meta.outputs.image_uri }}"

      - name: Publicar imagen en Amazon ECR (SHA + latest)
        run: |
          docker push "${{ steps.meta.outputs.image_uri }}"
          docker push "${{ steps.meta.outputs.image_latest }}"

  # ============================================================================
  # ETAPA 3: Orquestación y Rolling Update en Amazon EKS (Kubernetes)
  # ============================================================================
  deploy-to-eks:
    name: 3. Orchestrate — Deploy to Amazon EKS
    needs: build-and-push-ecr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de manifiestos Kubernetes
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Conectar kubectl al clúster Amazon EKS
        run: |
          aws sts get-caller-identity
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Aplicar manifiestos y desplegar nueva imagen en Kubernetes
        env:
          IMAGE_URI: ${{ needs.build-and-push-ecr.outputs.image_uri }}
          APP_VERSION: ${{ needs.build-and-push-ecr.outputs.app_version }}
        run: |
          kubectl apply -f k8s/01-namespace.yaml
          kubectl apply -f k8s/02-configmap.yaml

          sed -e "s|IMAGE_URI_PLACEHOLDER|${IMAGE_URI}|g" \
              -e "s|APP_VERSION_PLACEHOLDER|${APP_VERSION}|g" \
              k8s/03-deployment.yaml | kubectl apply -f -

          kubectl apply -f k8s/04-service.yaml
          kubectl apply -f k8s/05-hpa.yaml

      - name: Verificar Rolling Update y obtener URL del Load Balancer
        run: |
          kubectl rollout status deployment/orbitcloud-landing -n "$K8S_NAMESPACE" --timeout=180s
          kubectl get pods -n "$K8S_NAMESPACE" -o wide

          LB_ENDPOINT=""
          for i in $(seq 1 12); do
            LB_ENDPOINT=$(kubectl get svc orbitcloud-landing-svc -n "$K8S_NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -z "$LB_ENDPOINT" ]; then
              LB_ENDPOINT=$(kubectl get svc orbitcloud-landing-svc -n "$K8S_NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            fi
            if [ -n "$LB_ENDPOINT" ]; then
              break
            fi
            echo "Esperando asignacion de DNS del AWS Load Balancer ($i/12)..."
            sleep 5
          done

          echo "============================================================"
          echo "Despliegue completado en EKS: ${{ secrets.EKS_CLUSTER_NAME }}"
          echo "Imagen desplegada : ${{ needs.build-and-push-ecr.outputs.image_uri }}"
          echo "Version activa    : ${{ needs.build-and-push-ecr.outputs.app_version }}"
          if [ -n "$LB_ENDPOINT" ]; then
            echo "URL Frontend      : http://${LB_ENDPOINT}"
          else
            echo "URL Frontend      : Ejecuta 'kubectl get svc -n $K8S_NAMESPACE' en unos segundos"
          fi
          echo "============================================================"

          {
            echo "## Despliegue Exitoso en Amazon EKS"
            echo "- **Clúster EKS**: \`${{ secrets.EKS_CLUSTER_NAME }}\` (\`${{ secrets.AWS_REGION }}\`)"
            echo "- **Namespace**: \`${K8S_NAMESPACE}\`"
            echo "- **Versión**: \`${{ needs.build-and-push-ecr.outputs.app_version }}\`"
            echo "- **Imagen en ECR**: \`${{ needs.build-and-push-ecr.outputs.image_uri }}\`"
            if [ -n "$LB_ENDPOINT" ]; then
              echo "- **URL Pública del Landing**: http://${LB_ENDPOINT}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
